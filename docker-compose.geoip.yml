# Geoblocking override — arms the geoip2 country lookup.
#
#   docker compose -f docker-compose.yml -f docker-compose.geoip.yml up -d
#
# The sidecar keeps GeoLite2-Country fresh (weekly); the product mounts the
# same volume read-only at /data/geoip, where the s6 geoip2-arm oneshot
# picks it up at boot: hosts with country rules become active after the
# next boot AND a re-save of each host (the config regenerates with the
# if() lines). Without the DB, country rules stay stored but dormant.
#
# Credentials live in your .env — NEVER in this file.
services:
  geoipupdate:
    image: maxmindinc/geoipupdate:v8.0
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: 168 # hours — weekly
      GEOIPUPDATE_PRESERVE_CONFIG_TIMES: 1
    volumes:
      - proxywarden_geoip:/usr/share/GeoIP

  proxywarden:
    volumes:
      - proxywarden_data:/data
      - proxywarden_le:/etc/letsencrypt
      - proxywarden_geoip:/data/geoip:ro

volumes:
  proxywarden_data: {}
  proxywarden_le: {}
  proxywarden_geoip: {}

name: build

on:
  push:
    branches: [main, phase-b/nginx-base]
    paths:
      - build/**
      - vendor/**
      - patches/**
      - sidecar/**
      - test-runtime/**
      - scripts/**
      - docker-compose.test.yml
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # weekly drift-check

env:
  NPM_FRONTEND_REF: v2.17.0
  NPM_COMMIT: '5c8aec9bdeca0a2fb6a71e060ec598aa6eddd186'   # vendored sha — must equal vendor/npm-frontend/PROVENANCE.md
  OVERLAY_TAG: 2.17.0-nginx1.31.9-modsec3.0.17-crs4.30.0-vts0.2.7-purge3.0.4-brotli1.2.1
  # The published WAF overlay image — now the funkysys-org/nginx-full stack
  # (Phase A2b: base + app + WAF merged into one pipeline, one image family).
  OVERLAY_IMAGE: ghcr.io/funkysys-org/nginx-full:2.17.0-nginx1.31.9-modsec3.0.17-crs4.30.0-vts0.2.7-purge3.0.4-brotli1.2.1
  IMAGE: ghcr.io/funkysys-org/proxywarden

permissions:
  contents: read
  packages: write

jobs:
  pins-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pins match and invariants hold
        run: |
          set -eu
          df_ref="$(sed -n 's/^ARG NPM_FRONTEND_REF=//p' build/Dockerfile)"
          if [ "$NPM_FRONTEND_REF" != "$df_ref" ]; then
            echo "::error::NPM_FRONTEND_REF drift: workflow '$NPM_FRONTEND_REF' vs build/Dockerfile '$df_ref'"
            exit 1
          fi
          case "$OVERLAY_IMAGE" in
            *REPLACE-ME*)
              echo "::error::OVERLAY_IMAGE is still the placeholder — set it in this workflow env"
              exit 1;;
          esac
          prov_sha=$(sed -n 's/^| Commit | \(.*\) |$/\1/p' vendor/npm-frontend/PROVENANCE.md | tr -d ' ')
          if [ "$NPM_COMMIT" != "$prov_sha" ]; then
            echo "::error::PROVENANCE MISMATCH: workflow NPM_COMMIT '$NPM_COMMIT' vs vendored '$prov_sha' — re-vendor or fix the pin"
            exit 1
          fi
          fe_ver="${NPM_FRONTEND_REF#v}"
          ov_ver="${OVERLAY_TAG%%-*}"
          if [ "$fe_ver" != "$ov_ver" ]; then
            echo "::error::frontend v$fe_ver vs overlay built for NPM $ov_ver — never ship a frontend against a different backend version"
            exit 1
          fi
          echo "pins-sync OK: frontend $NPM_FRONTEND_REF matches overlay $OVERLAY_TAG"

  build:
    needs: pins-sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (frontend fork on the overlay)
        run: |
          set -eu
          TAG="$OVERLAY_TAG-fe${NPM_FRONTEND_REF#v}"
          docker pull "$OVERLAY_IMAGE"   # fail fast & clear if not published/accessible
          docker build -f build/Dockerfile \
            --build-arg NPM_FRONTEND_REF="$NPM_FRONTEND_REF" \
            --build-arg OVERLAY_IMAGE="$OVERLAY_IMAGE" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
      - name: Compose UI smoke (layering gate)
        run: |
          set -eu
          TAG="$OVERLAY_TAG-fe${NPM_FRONTEND_REF#v}"
          PROXYWARDEN_IMAGE="$IMAGE:$TAG" docker compose -f docker-compose.test.yml up -d
          bash scripts/smoke-ui.sh
          docker compose -f docker-compose.test.yml down -v
      # Branch discipline: phase-b builds + smokes, but ONLY main
      # publishes (the branch publishes nothing until it merges).
      - name: Push (only after SMOKE OK)
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          TAG="$OVERLAY_TAG-fe${NPM_FRONTEND_REF#v}"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  drift-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Has upstream NPM moved?
        run: |
          set -eu
          latest="$(git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/NginxProxyManager/nginx-proxy-manager.git 'v2*' \
            | head -1 | sed 's|.*refs/tags/||')"
          echo "upstream latest: $latest | our frontend pin: $NPM_FRONTEND_REF"
          if [ "$NPM_FRONTEND_REF" != "$latest" ]; then
            echo "::error::UPSTREAM MOVED ($latest). Pins are a human decision — never auto-rebuild:"
            echo "bump NPM_FRONTEND_REF (here + build/Dockerfile) AND rebuild the overlay image first"
            echo "(repo 1) if the NPM version itself changed."
            exit 1
          fi
          echo "drift-check OK: upstream still matches the frontend pin"

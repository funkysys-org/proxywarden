# ModSecurity engine config for the NPM+ModSec image.
# Defaults are CONSERVATIVE: DetectionOnly (log, don't block). Turn blocking on
# per host in the Advanced tab with:  modsecurity_rules 'SecRuleEngine On';
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 33554432
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /data/logs/modsec_audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogFormat JSON
SecArgumentSeparator "&"
SecCookieFormat 0
SecTmpDir /tmp
SecDataDir /tmp
# NOTE (spike finding): libmodsecurity v3 rejects the classic v2-style
# SecDefaultAction phase:1 + phase:2 pair in this include context
# ("can only be placed once per phase and configuration context").
# The engine's built-in defaults (phase:1/2 pass) apply — CRS 4 needs no
# explicit SecDefaultAction here.
SecUnicodeMapFile /usr/local/modsecurity/etc/unicode.mapping 20127

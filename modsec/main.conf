# Include chain referenced by `modsecurity_rules_file /etc/nginx/modsec/main.conf`.
# Engine conf + CRS live in the image; TUNABLES live under /data/modsec so they
# survive container recreation and can be edited without an image rebuild.
Include /etc/nginx/modsec/modsecurity.conf
Include /data/modsec/crs-setup.conf
Include /data/modsec/rules-before.conf
Include /usr/local/modsecurity/crs/rules/*.conf
Include /data/modsec/rules-after.conf

# Blocking chain: same include order as main.conf, but the engine is switched
# to enforcement as the LAST directive of the rules set.
# NOTE (verified empirically): a later inline `modsecurity_rules
# 'SecRuleEngine On';` does NOT override a rules file's DetectionOnly —
# per-host blocking must point modsecurity_rules_file at THIS file.
Include /etc/nginx/modsec/modsecurity.conf
Include /data/modsec/crs-setup.conf
Include /data/modsec/rules-before.conf
Include /usr/local/modsecurity/crs/rules/*.conf
Include /data/modsec/rules-after.conf
SecRuleEngine On

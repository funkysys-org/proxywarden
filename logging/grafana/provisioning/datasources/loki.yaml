# Grafana datasource provisioning — Loki is ready at first boot, no manual
# setup. The dashboard-less wave 1: Explore + LogQL work out of the box.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false

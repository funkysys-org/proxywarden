# proxywarden — brotli compression defaults (http context).
# The filter module ships in the image (libbrotli pinned at the
# CVE-2026-111497 fix — see overlay/Dockerfile); this turns it on globally.
# gzip stays stock as the fallback for clients without br support.
# No stock directive is redeclared — brotli_* only exists with the module.

brotli on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_types
	text/plain
	text/css
	text/javascript
	application/javascript
	application/json
	application/xml
	application/rss+xml
	image/svg+xml;

# serve pre-compressed .br files when a static host ships them
brotli_static on;

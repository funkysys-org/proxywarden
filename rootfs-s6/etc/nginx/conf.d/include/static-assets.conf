# Static asset caching for static hosts (wave 024, always-on by design):
# the files are served by nginx itself, so the browser-side cache is the
# whole story — the proxy-cache machinery does not apply to a static host.
# 7d without `immutable`: static-host asset names are typically NOT
# content-hashed, so an aggressive immutable flag would serve stale
# assets for a month after an update.
location ~* ^.*\.(css|js|mjs|jpe?g|gif|png|webp|avif|woff|woff2|eot|ttf|otf|svg|ico|css\.map|js\.map)$ {
	expires 7d;
	access_log off;
	try_files $uri =404;
}

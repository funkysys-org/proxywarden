# proxywarden — production deploy stack (single file).
#
#   cp env.example .env    # pin the exact image tag (no floating :latest)
#   docker login ghcr.io   # PAT with read:packages — the registry is private
#   docker compose pull
#   docker compose up -d
#
# First boot on FRESH volumes shows the SETUP page on :81 (create the admin).
# The WAF ships DORMANT: no host is filtered until you flip a switch in the UI
# (proxy host → Options → WAF DetectionOnly, then WAF Block when satisfied).
#
# /data and /etc/letsencrypt must be mounted VOLUMES — the stock prepare
# service hard-fails without them. They survive recreates: the SQLite DB,
# nginx host configs, certs and the modsec tunables (/data/modsec) live there.
#
# GEOBLOCKING (optional, one line in .env): set COMPOSE_PROFILES=geoip and
# fill MAXMIND_ACCOUNT_ID/MAXMIND_LICENSE_KEY — the geoipupdate sidecar
# below keeps GeoLite2-Country fresh in the shared volume and the image's
# s6 oneshot arms the lookup at boot. WITHOUT the profile the sidecar is
# ignored entirely (no container, no crash-loop) and the country rules on
# hosts stay stored but dormant.

services:
  proxywarden:
    image: ${PROXYWARDEN_IMAGE:-ghcr.io/funkysys-org/proxywarden:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Admin UI. To keep it off the public interface, bind it local and
      # tunnel in:  "127.0.0.1:81:81"  +  ssh -L 8081:127.0.0.1:81 <host>
      - "81:81"
    volumes:
      - proxywarden_data:/data
      - proxywarden_le:/etc/letsencrypt
      # GeoLite2 lands here via the geoip profile below; without the DB the
      # armer keeps country rules dormant — an empty volume is harmless.
      - proxywarden_geoip:/data/geoip:ro

  # Optional sidecar (profile "geoip"): refreshes GeoLite2-Country weekly.
  # Credentials live in .env — NEVER in this file.
  geoipupdate:
    image: maxmindinc/geoipupdate:v8.0
    restart: unless-stopped
    profiles: ["geoip"]
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country
      GEOIPUPDATE_FREQUENCY: 168 # hours — weekly
      GEOIPUPDATE_PRESERVE_CONFIG_TIMES: 1
    volumes:
      - proxywarden_geoip:/usr/share/GeoIP

  # ─── Optional logging stack (profile "logging"): Loki + Alloy + Grafana ───
  # Same opt-in shape as the geoip sidecar: add "logging" to COMPOSE_PROFILES
  # in .env (e.g. COMPOSE_PROFILES=geoip,logging). Configs are versioned in
  # ./logging/ and mounted read-only; no secret ever lives in the compose.
  loki:
    image: grafana/loki:3.6.22
    restart: unless-stopped
    profiles: ["logging"]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    # no ports: Grafana reaches it on the compose network at loki:3100

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    profiles: ["logging"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container log discovery
      - proxywarden_data:/data:ro                        # WAF audit log tail
    # no ports: the Alloy UI stays off the public interface

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    profiles: ["logging"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # Loopback only — tunnel in like :81:
      #   ssh -L 3000:127.0.0.1:3000 <host>
      - "127.0.0.1:3000:3000"

volumes:
  proxywarden_data: {}
  proxywarden_le: {}
  proxywarden_geoip: {}
  loki_data: {}
  grafana_data: {}

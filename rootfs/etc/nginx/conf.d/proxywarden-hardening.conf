# proxywarden — global hardening defaults (http context).
# Baked into the image; picked up by the stock `include /etc/nginx/conf.d/*.conf;`.
# No stock file is modified; per-server config can still override.
#
# NOTE: the stock nginx.conf already sets `server_tokens off`,
# `keepalive_timeout 90s` and `proxy_send_timeout 90s` at http level —
# do NOT redeclare them here (duplicate directive = fatal config error).

# --- TLS defaults (servers without their own ssl_* settings) ---
# NOTE: stock nginx.conf sets `ssl_prefer_server_ciphers on` at http level —
# cannot be overridden here (duplicate directive = fatal). Left as stock.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- Slow-client / slowloris resistance ---
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
large_client_header_buffers 4 16k;

# --- Header hygiene ---
# server_tokens off (stock) still emits "Server: nginx"; clear it entirely.
more_clear_headers Server;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# --- Proxied backends: hide implementation hints ---
proxy_hide_header X-Powered-By;

# --- Connection-flood guard (generous: normal traffic and big NATs unaffected) ---
limit_conn_zone $binary_remote_addr zone=proxywarden_perip:10m;
limit_conn proxywarden_perip 256;
# --- nginx: [warn] could not build optimal variables_hash, you should increase either variables_hash_max_size: 1024 or variables_hash_bucket_size: 64; ignoring variables_hash_bucket_size
variables_hash_max_size 2048;

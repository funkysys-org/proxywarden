{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}
{% include "_exploits.conf" %}

  # WAF (wave 024): the static host arms the WAF by default — a host that
  # opts out (waf_enabled=false) is turned off per-request by the
  # Host-matched ctl:ruleEngine=Off rule the panel manages in the marked
  # block of rules-before.conf (data, not config).
  modsecurity on;
  modsecurity_rules_file /etc/nginx/modsec/main-block.conf;

  # Static asset caching — always on: the browser caches the assets
  # (expires + immutable), the files are served by nginx itself (no
  # proxy-cache machinery applies to a static host).
  include conf.d/include/static-assets.conf;

{% if geoip2_enabled and country_deny %}
{% if country_list_mode == "allow" %}
  # Country allow-list (whitelist) — a visitor NOT in the list is blocked
  # (armed by the geoip2 include, GeoLite2 DB present)
  if ($country_code !~ ^({{ country_deny | join: "|" }})$) {
    return 403;
  }
{% else %}
  # Country deny — armed by the geoip2 include (GeoLite2 DB present)
  if ($country_code ~ ^({{ country_deny | join: "|" }})$) {
    return 403;
  }
{% endif %}
{% endif %}

  access_log /data/logs/static-host-{{ id }}_access.log standard;
  error_log /data/logs/static-host-{{ id }}_error.log warn;

{{ advanced_config }}

{% if use_default_location %}
  location / {
{% include "_hsts.conf" %}
{% if document_root %}
    root {{ document_root }};
    index index.html;
    try_files $uri $uri/ =404;
{% else %}
    root /data/nginx/static_host/{{ id }};
    try_files /index.html =404;
{% endif %}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_static[.]conf;
}
{% endif %}
